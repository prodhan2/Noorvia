name: noorvia
description: "Noorvia: A modern, offline-first Islamic lifestyle companion featuring accurate prayer times, Azan, Quran, Qibla compass, Ruqyah, and Duas."
publish_to: 'none'
version: 1.0.1+1001

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  percent_indicator: ^4.2.3
  intl: ^0.20.2
  http: ^1.2.2
  audioplayers: ^6.1.0
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  workmanager: ^0.9.0
  connectivity_plus: ^6.1.4
  flutter_svg: ^2.0.10+1
  flutter_markdown: ^0.7.4
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  web: ^1.1.0
  flutter_compass: ^0.8.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  sensors_plus: ^6.1.0
  timezone: ^0.9.4
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  shimmer: ^3.0.0
  adhan_dart: ^1.2.0
  hijri: ^3.0.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1
  flutter_localizations:
    sdk: flutter
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  mobile_scanner: ^7.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/noorvia_app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F4D2A"
  adaptive_icon_foreground: "assets/noorvia_app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/audio/
    - assets/noorvia_app_logo.png
  fonts:
    - family: NooreHuda
      fonts:
        - asset: assets/fonts/NooreHuda.ttf
    - family: NooreHera
      fonts:
        - asset: assets/fonts/NooreHera.ttf
